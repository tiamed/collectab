<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <!-- Sync theme before first paint — no visibility:hidden (avoids blank/stuck page). Only sets data-theme on an explicit choice; otherwise CSS @media (prefers-color-scheme) follows the OS and stays live. -->
    <script src="/theme-init.js"></script>
    <!-- Critical background before CSS bundle loads — mirrors style.css :root/[data-theme]/@media. -->
    <style>
      html { background-color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background-color: #1e1e2e; }
      }
      html[data-theme="dark"] { background-color: #1e1e2e; }
    </style>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
